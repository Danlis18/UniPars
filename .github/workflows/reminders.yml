name: Subscription reminders

# Щогодини: нагадування про кінець підписки за 3 дні (сповіщення в UniPars + push у браузер).
# Кожен період нагадується один раз, тож частий запуск не дублює повідомлення.
# Секрети: REMINDERS_URL = https://unipars-backend-production.up.railway.app/api/internal/subscription-reminders
#          CRON_SECRET   = той самий CRON_SECRET, що в Railway (≥ 16 символів). Без них workflow нічого не робить.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      REMINDERS_URL: ${{ secrets.REMINDERS_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Надіслати нагадування
        if: env.REMINDERS_URL != '' && env.CRON_SECRET != ''
        run: |
          out=$(curl -s -w "\n%{http_code}" -X POST "$REMINDERS_URL" -H "X-Cron-Secret: $CRON_SECRET")
          code=$(echo "$out" | tail -1)
          echo "$out" | head -1
          [ "$code" = "200" ] || { echo "::error::Нагадування не вдалися (HTTP $code): перевірте REMINDERS_URL і CRON_SECRET"; exit 1; }
