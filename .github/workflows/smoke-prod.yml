name: Production smoke check

# Перевіряє бойовий сайт кожні 30 хвилин і після кожного push у main.
# Якщо щось ламається — GitHub надішле лист власнику репозиторію.
on:
  schedule:
    - cron: "*/30 * * * *"
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Зачекати на деплой Railway після push
        if: github.event_name == 'push'
        run: sleep 240
      - run: python scripts/smoke_prod.py
        env: { PYTHONIOENCODING: utf-8 }
