<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>UniShare — платформа взаємодопомоги студентів</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
</head>
<body>
  <div class="layout">
    <!-- ЛІВЕ МЕНЮ -->
    <aside class="sidebar">
      <a href="#/" class="logo" title="UniShare">
        <svg viewBox="0 0 32 32" width="34" height="34"><rect width="32" height="32" rx="9" fill="var(--accent)"/><path d="M9 9v8a7 7 0 0 0 14 0V9" stroke="#fff" stroke-width="3.2" fill="none" stroke-linecap="round"/><circle cx="16" cy="24.5" r="0" fill="#fff"/></svg>
        <span>UniShare</span>
      </a>
      <nav class="nav" id="nav"></nav>
      <button class="btn-primary big" id="openCompose">Поділитися</button>
      <div class="me" id="meCard"></div>
    </aside>

    <!-- ЦЕНТР -->
    <main class="main" id="main"></main>

    <!-- ПРАВА КОЛОНКА -->
    <aside class="aside">
      <form class="search" id="searchForm">
        <svg viewBox="0 0 24 24" width="18"><path d="M10.5 3a7.5 7.5 0 0 1 5.9 12.1l4.8 4.8-1.4 1.4-4.8-4.8A7.5 7.5 0 1 1 10.5 3zm0 2a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11z" fill="currentColor"/></svg>
        <input id="searchInput" placeholder="Пошук матеріалів" />
      </form>

      <section class="card promo">
        <h3>AI-помічник 24/7</h3>
        <p>Застряг на лабі чи задачі? AI пояснить хід розв'язання крок за кроком.</p>
        <a class="btn-accent" href="#/ai">Запитати AI</a>
      </section>

      <section class="card" id="newsCard">
        <div class="card-head"><h3>Новини університету</h3><span class="live" id="newsLive"></span></div>
        <div id="newsList" class="news-list"><div class="muted pad">Завантаження…</div></div>
      </section>

      <section class="card">
        <div class="card-head"><h3>Популярні предмети</h3></div>
        <div id="subjectsList"></div>
      </section>
      <footer class="foot">UniShare © 2026 · Платформа взаємодопомоги студентів</footer>
    </aside>
  </div>

  <!-- Плаваюча кнопка AI (замість Grok) -->
  <a href="#/ai" class="fab" title="AI-помічник">
    <svg viewBox="0 0 24 24" width="26"><path d="M12 2l1.9 5.6L19.5 9.5l-5.6 1.9L12 17l-1.9-5.6L4.5 9.5l5.6-1.9L12 2zm7 12l.9 2.6 2.6.9-2.6.9L19 21l-.9-2.6-2.6-.9 2.6-.9L19 14z" fill="currentColor"/></svg>
  </a>

  <!-- Модалка публікації -->
  <dialog id="composeDialog" class="dialog">
    <form method="dialog" class="dialog-head"><button class="icon-btn" aria-label="Закрити">✕</button></form>
    <div id="composeSlot"></div>
  </dialog>

  <nav class="bottom-nav" id="bottomNav"></nav>
  <script src="/app.js" type="module"></script>
</body>
</html>
